name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/akhil2448/pitwall-backend:latest
            ghcr.io/akhil2448/pitwall-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package host-side ingestion code
        run: |
          set -e

          rm -f pitwall_ingestion.tar.gz

          tar \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf pitwall_ingestion.tar.gz \
            pitwall_ingestion

          echo "========================================"
          echo "Host-side ingestion package created"
          echo "========================================"
          ls -lh pitwall_ingestion.tar.gz

      - name: Deploy Docker and verify production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            set -e

            IMAGE="ghcr.io/akhil2448/pitwall-backend:${{ github.sha }}"
            CONTAINER="pitwall-backend-v1"
            CACHE_DIR="/opt/pitwall/cache"
            CACHE_DB="$CACHE_DIR/fastf1_http_cache.sqlite"
            TEST_ENDPOINT="http://localhost:8000/api/qualifying/2026/12"

            echo "========================================"
            echo "Starting deployment"
            echo "New image: $IMAGE"
            echo "========================================"

            # ------------------------------------------------------------
            # Helper: verify the production cache volume.
            # ------------------------------------------------------------
            verify_cache_volume() {
              local CONTEXT="$1"

              echo "----------------------------------------"
              echo "Verifying PitWall cache volume ($CONTEXT)"
              echo "----------------------------------------"

              if ! mountpoint -q "$CACHE_DIR"; then
                echo "ERROR: $CACHE_DIR is not mounted."
                echo "Refusing to continue."
                return 1
              fi

              if [ ! -f "$CACHE_DB" ]; then
                echo "ERROR: FastF1 HTTP cache is missing:"
                echo "$CACHE_DB"
                return 1
              fi

              if [ ! -d "$CACHE_DIR/2026" ]; then
                echo "ERROR: 2026 FastF1 cache directory is missing."
                return 1
              fi

              echo "Cache filesystem:"
              findmnt -no SOURCE,FSTYPE,SIZE,USED,AVAIL,TARGET "$CACHE_DIR"

              echo "Cache database:"
              ls -lh "$CACHE_DB"

              echo "Cache usage:"
              du -sh "$CACHE_DIR"

              echo "Cache volume verification successful."
              return 0
            }

            # ------------------------------------------------------------
            # Helper: verify that the running container can see the cache.
            # ------------------------------------------------------------
            verify_container_cache() {
              echo "----------------------------------------"
              echo "Verifying container cache"
              echo "----------------------------------------"

              if ! docker exec "$CONTAINER" mountpoint -q /app/cache; then
                echo "ERROR: /app/cache is not mounted inside container."
                return 1
              fi

              if ! docker exec "$CONTAINER" test -f /app/cache/fastf1_http_cache.sqlite; then
                echo "ERROR: FastF1 SQLite cache is not visible inside container."
                return 1
              fi

              if ! docker exec "$CONTAINER" test -d /app/cache/2026; then
                echo "ERROR: 2026 cache directory is not visible inside container."
                return 1
              fi

              echo "Container cache filesystem:"
              docker exec "$CONTAINER" df -h /app/cache

              echo "Container cache database:"
              docker exec "$CONTAINER" ls -lh /app/cache/fastf1_http_cache.sqlite

              echo "Container cache verification successful."
              return 0
            }

            # ------------------------------------------------------------
            # Helper: test the production application.
            # ------------------------------------------------------------
            verify_application() {
              local CONTEXT="$1"

              echo "----------------------------------------"
              echo "Testing application ($CONTEXT)"
              echo "----------------------------------------"

              echo "Testing health endpoint..."

              if ! curl \
                --fail \
                --silent \
                --show-error \
                --retry 5 \
                --retry-delay 2 \
                --max-time 20 \
                http://localhost:8000/health \
                >/dev/null; then

                echo "ERROR: Health check failed."
                return 1
              fi

              echo "Health check successful."

              echo "Testing cache-backed API:"
              echo "$TEST_ENDPOINT"

              if ! curl \
                --fail \
                --silent \
                --show-error \
                --retry 3 \
                --retry-delay 2 \
                --max-time 60 \
                "$TEST_ENDPOINT" \
                >/dev/null; then

                echo "ERROR: Cache-backed API test failed."
                return 1
              fi

              echo "Cache-backed API test successful."
              echo "Application verification successful."
              return 0
            }

            # ------------------------------------------------------------
            # Helper: rollback Docker container only.
            # Host-side ingestion deployment is independent.
            # ------------------------------------------------------------
            rollback() {
              echo "========================================"
              echo "STARTING AUTOMATIC ROLLBACK"
              echo "========================================"

              if [ -z "$CURRENT_IMAGE" ]; then
                echo "CRITICAL: No previous production image available."
                return 1
              fi

              echo "Previous production image:"
              echo "$CURRENT_IMAGE"

              echo "Stopping failed container..."
              docker stop "$CONTAINER" 2>/dev/null || true

              echo "Removing failed container..."
              docker rm "$CONTAINER" 2>/dev/null || true

              echo "Verifying cache volume before rollback..."

              if ! verify_cache_volume "rollback"; then
                echo "CRITICAL: Cache volume verification failed."
                return 1
              fi

              echo "Pulling previous production image..."
              docker pull "$CURRENT_IMAGE"

              echo "Starting previous production image..."

              if ! docker run -d \
                --name "$CONTAINER" \
                -p 127.0.0.1:8000:8000 \
                -e ENV=production \
                -e FASTF1_CACHE_DIR=/app/cache \
                -e SESSION_MANIFEST_PATH=/app/metadata/session_manifest.json \
                -e FRONTEND_URL=https://pitwallf1.pages.dev \
                -e LOG_LEVEL=INFO \
                -v /opt/pitwall/cache:/app/cache \
                -v /opt/pitwall/metadata:/app/metadata:ro \
                --restart unless-stopped \
                "$CURRENT_IMAGE"; then

                echo "CRITICAL: Failed to start rollback container."
                docker logs --tail 100 "$CONTAINER" 2>/dev/null || true
                docker rm -f "$CONTAINER" 2>/dev/null || true
                return 1
              fi

              echo "Waiting for rollback application startup..."
              sleep 5

              if ! verify_container_cache; then
                echo "CRITICAL: Rollback container cannot access cache."
                docker logs --tail 100 "$CONTAINER" || true
                return 1
              fi

              if ! verify_application "rollback"; then
                echo "========================================"
                echo "CRITICAL: ROLLBACK APPLICATION TEST FAILED"
                echo "========================================"

                docker logs --tail 100 "$CONTAINER" || true
                return 1
              fi

              echo "========================================"
              echo "ROLLBACK SUCCESSFUL"
              echo "Production restored to:"
              echo "$CURRENT_IMAGE"
              echo "========================================"

              return 0
            }

            # ------------------------------------------------------------
            # Determine current production image.
            # ------------------------------------------------------------
            echo "Checking current production container..."

            if docker inspect "$CONTAINER" >/dev/null 2>&1; then
              CURRENT_IMAGE=$(docker inspect -f '{{.Config.Image}}' "$CONTAINER")
              echo "Current image: $CURRENT_IMAGE"
            else
              CURRENT_IMAGE=""
              echo "No existing production container found."
            fi

            # ------------------------------------------------------------
            # IMPORTANT: verify the block volume before touching Docker.
            # ------------------------------------------------------------
            if ! verify_cache_volume "pre-deployment"; then
              echo "ERROR: Production cache volume verification failed."
              exit 1
            fi

            # ------------------------------------------------------------
            # Pull the new image.
            # ------------------------------------------------------------
            echo "Pulling new image..."
            docker pull "$IMAGE"

            # ------------------------------------------------------------
            # Stop/remove existing container.
            # ------------------------------------------------------------
            echo "Stopping current container..."
            docker stop "$CONTAINER" 2>/dev/null || true

            echo "Removing current container..."
            docker rm "$CONTAINER" 2>/dev/null || true

            # ------------------------------------------------------------
            # Start new production container.
            # ------------------------------------------------------------
            echo "Starting new production container..."

            if ! docker run -d \
              --name "$CONTAINER" \
              -p 127.0.0.1:8000:8000 \
              -e ENV=production \
              -e FASTF1_CACHE_DIR=/app/cache \
              -e SESSION_MANIFEST_PATH=/app/metadata/session_manifest.json \
              -e FRONTEND_URL=https://pitwallf1.pages.dev \
              -e LOG_LEVEL=INFO \
              -v /opt/pitwall/cache:/app/cache \
              -v /opt/pitwall/metadata:/app/metadata:ro \
              --restart unless-stopped \
              "$IMAGE"; then

              echo "========================================"
              echo "FAILED TO START NEW CONTAINER"
              echo "========================================"

              docker logs --tail 100 "$CONTAINER" 2>/dev/null || true
              docker rm -f "$CONTAINER" 2>/dev/null || true

              if rollback; then
                exit 1
              else
                echo "CRITICAL: Automatic rollback failed."
                exit 1
              fi
            fi

            # ------------------------------------------------------------
            # Give application a moment to initialize.
            # ------------------------------------------------------------
            echo "Waiting for application startup..."
            sleep 5

            # ------------------------------------------------------------
            # Verify container can see the block-volume cache.
            # ------------------------------------------------------------
            if ! verify_container_cache; then

              echo "========================================"
              echo "NEW DEPLOYMENT CACHE VERIFICATION FAILED"
              echo "========================================"

              docker logs --tail 100 "$CONTAINER" || true

              if rollback; then
                exit 1
              else
                echo "CRITICAL: Automatic rollback failed."
                exit 1
              fi
            fi

            # ------------------------------------------------------------
            # Verify health + real FastF1-backed endpoint.
            # ------------------------------------------------------------
            if ! verify_application "new deployment"; then

              echo "========================================"
              echo "NEW DEPLOYMENT APPLICATION TEST FAILED"
              echo "========================================"

              echo "New container logs:"
              docker logs --tail 100 "$CONTAINER" || true

              if rollback; then
                exit 1
              else
                echo "CRITICAL: Automatic rollback failed."
                exit 1
              fi
            fi

            # ------------------------------------------------------------
            # Deployment successful.
            # ------------------------------------------------------------
            echo "========================================"
            echo "Docker production deployment successful!"
            echo "Running image: $IMAGE"
            echo "========================================"

            # ------------------------------------------------------------
            # Docker image cleanup.
            # Keep the current and previous production images.
            # ------------------------------------------------------------
            echo "========================================"
            echo "Cleaning up old Docker images"
            echo "========================================"

            KEEP_IMAGES="$IMAGE"

            if [ -n "$CURRENT_IMAGE" ]; then
              KEEP_IMAGES="$KEEP_IMAGES $CURRENT_IMAGE"
            fi

            echo "Images protected from cleanup:"
            echo "$KEEP_IMAGES"

            echo "Finding old PitWall backend images..."

            ALL_IMAGES=$(docker images \
              "ghcr.io/akhil2448/pitwall-backend" \
              --format '{{.Repository}}:{{.Tag}}' \
              | grep -v ':latest$' || true)

            for OLD_IMAGE in $ALL_IMAGES; do

              if echo "$KEEP_IMAGES" | grep -F -q "$OLD_IMAGE"; then
                echo "Keeping: $OLD_IMAGE"
                continue
              fi

              echo "Removing old image: $OLD_IMAGE"
              docker image rm "$OLD_IMAGE" || true

            done

            echo "Docker image cleanup completed."

            # ------------------------------------------------------------
            # Final Docker deployment summary.
            # ------------------------------------------------------------
            echo "========================================"
            echo "Docker deployment completed successfully!"
            echo "========================================"

            echo "Production image:"
            docker inspect -f '{{.Config.Image}}' "$CONTAINER"

            echo "Production cache:"
            findmnt -no SOURCE,FSTYPE,SIZE,USED,AVAIL,TARGET "$CACHE_DIR"

            echo "Container cache:"
            docker exec "$CONTAINER" df -h /app/cache

      - name: Copy host-side ingestion package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          source: "pitwall_ingestion.tar.gz"
          target: "/tmp"

      - name: Install and verify host-side ingestion package
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            set -e

            INGESTION_ROOT="/opt/pitwall/ingestion"
            PACKAGE_DIR="$INGESTION_ROOT/pitwall_ingestion"
            ARCHIVE="/tmp/pitwall_ingestion.tar.gz"
            BACKUP_ROOT="/opt/pitwall/ingestion-backup"
            TMP_ROOT="/tmp/pitwall_ingestion_install"

            echo "========================================"
            echo "Deploying host-side ingestion package"
            echo "========================================"

            if [ ! -f "$ARCHIVE" ]; then
              echo "ERROR: Ingestion package archive not found:"
              echo "$ARCHIVE"
              exit 1
            fi

            mkdir -p "$INGESTION_ROOT"

            restore_host_ingestion() {
              echo "========================================"
              echo "HOST INGESTION ROLLBACK"
              echo "========================================"

              if [ ! -d "$BACKUP_ROOT" ]; then
                echo "CRITICAL: No host ingestion backup exists."
                return 1
              fi

              echo "Removing failed host-side package..."
              rm -rf "$PACKAGE_DIR"

              echo "Restoring previous host-side package..."
              mv "$BACKUP_ROOT" "$PACKAGE_DIR"

              chown -R ubuntu:ubuntu "$INGESTION_ROOT"

              export PYTHONPATH="$INGESTION_ROOT:$PYTHONPATH"

              if ! python3 -c \
                "from pitwall_ingestion.config import config; print('Rollback config import OK')"; then
                echo "CRITICAL: Restored package failed config import."
                return 1
              fi

              if ! python3 "$PACKAGE_DIR/scripts/future_scheduler.py" --help >/dev/null; then
                echo "CRITICAL: Restored scheduler failed verification."
                return 1
              fi

              echo "Host-side ingestion rollback successful."
              return 0
            }

            echo "Creating rollback backup..."

            rm -rf "$BACKUP_ROOT"

            if [ -d "$PACKAGE_DIR" ]; then
              cp -a "$PACKAGE_DIR" "$BACKUP_ROOT"
              echo "Existing host-side package backed up."
            else
              echo "No existing host-side package found; this is the first install."
            fi

            echo "Extracting package to temporary directory..."

            rm -rf "$TMP_ROOT"
            mkdir -p "$TMP_ROOT"

            if ! tar -xzf "$ARCHIVE" -C "$TMP_ROOT"; then
              echo "ERROR: Failed to extract host-side ingestion package."
              rm -rf "$TMP_ROOT"
              exit 1
            fi

            NEW_PACKAGE="$TMP_ROOT/pitwall_ingestion"

            if [ ! -f "$NEW_PACKAGE/config.py" ]; then
              echo "ERROR: config.py missing from package."
              find "$TMP_ROOT" -maxdepth 3 -type f | sort || true
              rm -rf "$TMP_ROOT"
              exit 1
            fi

            if [ ! -f "$NEW_PACKAGE/scripts/future_scheduler.py" ]; then
              echo "ERROR: future_scheduler.py missing from package."
              find "$TMP_ROOT" -maxdepth 3 -type f | sort || true
              rm -rf "$TMP_ROOT"
              exit 1
            fi

            echo "Installing new host-side package..."

            rm -rf "$PACKAGE_DIR"

            if ! mv "$NEW_PACKAGE" "$PACKAGE_DIR"; then
              echo "ERROR: Failed to install new host-side package."
              rm -rf "$TMP_ROOT"

              if [ -d "$BACKUP_ROOT" ] && ! restore_host_ingestion; then
                echo "CRITICAL: Host-side ingestion rollback failed."
              fi

              exit 1
            fi

            rm -rf "$TMP_ROOT"

            chown -R ubuntu:ubuntu "$INGESTION_ROOT"
            export PYTHONPATH="$INGESTION_ROOT:$PYTHONPATH"

            echo "Testing scheduler configuration import..."

            if ! python3 -c \
              "from pitwall_ingestion.config import config; print('Config import OK'); print(config)"; then

              echo "ERROR: Scheduler configuration import failed."

              if [ -d "$BACKUP_ROOT" ] && ! restore_host_ingestion; then
                echo "CRITICAL: Host-side ingestion rollback failed."
              fi

              exit 1
            fi

            echo "Testing scheduler..."

            if ! python3 "$PACKAGE_DIR/scripts/future_scheduler.py" --help >/dev/null; then

              echo "ERROR: Host-side scheduler verification failed."

              if [ -d "$BACKUP_ROOT" ] && ! restore_host_ingestion; then
                echo "CRITICAL: Host-side ingestion rollback failed."
              fi

              exit 1
            fi

            echo "Host-side scheduler package verification successful."

            rm -rf "$BACKUP_ROOT"
            rm -f "$ARCHIVE"

            echo "========================================"
            echo "Host-side ingestion deployment successful"
            echo "========================================"

            echo "Installed package:"
            ls -ld "$PACKAGE_DIR"
